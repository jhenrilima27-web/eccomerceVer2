<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seu carrinho</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body class="body-carrinho">
     <div class="container-carrinho">

        <header-carrinho class="header-carrinho">
            <img src="img/logo_png.png" class="logo-carrinho">
            <h1 class="titulo-carrinho">Angel</h1>
            <div class="botoes">
                <a href="index.html">
                <button type="button">Pagina Inicial</button>
                </a>
            </div>
        </header-carrinho>

        <card-carrinho class="card-carrinho">
            <img src="img/imagembrinquedo1.webp" class="imagem-produto">
            <div class="informações">
                <h3>Produto: Carrinho de policia</h3>
                <h3>Preço Unitário: R$35,00</h3>
                <h3>Unidades: 2</h3>
            </div>
        </card-carrinho>
      
        <card-total class="card-total">
            <h2><strong>Produto 1:</strong> R$70,00</h2>
            <h2><strong>Total:</strong>R$70,00 reais</h2><br><br>
            <h2>Formas de pagamento</h2><br>
            <div>
                <p>Selecione a forma de pagamento:</p><br>
                <select name="pagamento">
                    <option value="Pix">Pix</option>
                    <option value="Cartão de Débito">Cartão de Débito</option>
                    <option value="Cartão de Crédito">Cartão de Crédito</option>
                    <option value="Boleto">Boleto</option>
                </select>
            </div>         
        </card-total>

        
        <finalizar class="finalizar">
            <a href="pagFinal.html">
            <button type="button" class="botao-finalizar">Finalizar compra</button>
            </a>
        </finalizar>

        <footer-carrinho class="footer-carrinho">
             <p3><strong>Contatos:</strong></p3>
            <p>Email: angelbrinquedos@gmail.com</p>
            <p>Instagram: angel_brinquedos</p>
        </footer-carrinho>

   </div>
</body>
</body>
</html>
